# clockheart-workflow: 8
# Written by Clockheart. A Keystatic site with its admin on the live site runs on
# Cloudflare: on every change to main (a Publish, or a save in the live
# admin), GitHub builds it for Cloudflare and deploys the Worker. Logins and the
# admin's GitHub App keys are repo secrets; its name is the variable PUBLIC_KEYSTATIC_GITHUB_APP_SLUG.
name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    if: ${{ vars.CLOCKHEART_HOST == 'cloudflare' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${{ vars.PUBLIC_KEYSTATIC_GITHUB_APP_SLUG }}
      KEYSTATIC_GITHUB_CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
      KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
      KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build for Cloudflare
        run: npm ci && CLOCKHEART_TARGET=cloudflare npx astro build
      - name: Put it live on Cloudflare
        run: |
          set -e
          # Cloudflare sometimes asks to slow down (code 971, "wait N seconds"): wait and try again.
          for try in 1 2 3; do
            if npx wrangler deploy --message "$GITHUB_SHA" 2>&1 | tee deploy.log; [ "${PIPESTATUS[0]}" = 0 ]; then break; fi
            if [ "$try" = 3 ] || ! grep -q "code: 971" deploy.log; then exit 1; fi
            echo "Cloudflare asked to wait — trying again in a minute."; sleep 60
          done
          # The live admin's keys (its GitHub App), once it has one.
          if [ -n "$KEYSTATIC_GITHUB_CLIENT_ID" ]; then
            node -e 'const k=["KEYSTATIC_GITHUB_CLIENT_ID","KEYSTATIC_GITHUB_CLIENT_SECRET","KEYSTATIC_SECRET"];const o={};for(const n of k)o[n]=process.env[n]||"";process.stdout.write(JSON.stringify(o))' > "$RUNNER_TEMP/ks.json"
            npx wrangler secret bulk "$RUNNER_TEMP/ks.json" >/dev/null
            rm -f "$RUNNER_TEMP/ks.json"
          fi
