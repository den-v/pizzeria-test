title: Our story
intro: Forno Rosso began with one oven, two friends and a stubborn idea — that a real Neapolitan-style pizza could feel completely at home in Lviv's old town. Twelve years later the oven is still burning, the dough still rests for 48 hours, and many of our first guests now bring their children.
milestones:
  - year: 2014
    title: A tiny room on Virmenska
    text: Ostap and Giulia open a twelve-seat pizzeria with a borrowed electric oven and a menu of just four pizzas.
  - year: 2016
    title: The red oven arrives
    text: A wood-fired oven, hand-built in Naples, is carried in through the courtyard. Its red tiles give Forno Rosso its name.
  - year: 2018
    title: Lviv Forest is born
    text: Carpathian porcini and smoked bryndza meet on a garlic cream base. It has been our best-seller ever since.
  - year: 2021
    title: A courtyard terrace
    text: We open a summer terrace in the old courtyard, doubling our seats under the chestnut tree.
  - year: 2025
    title: Best pizzeria in Lviv
    text: Readers of a local city guide vote us the best pizzeria in town — we celebrate with a week of free Margheritas for neighbours.
